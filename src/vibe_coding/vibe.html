<div class="flex flex-col space-y-3 p-4 bg-white rounded-xl shadow-md">
  <label for="studentExplanation" class="text-sm font-semibold text-gray-700">
    1. Explain your idea / change log (Required):
  </label>
  <textarea 
    id="studentExplanation" 
    rows="2" 
    class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
    placeholder="E.g., I want to add a score variable that increases when the mouse moves over a rect so the player has a goal..."
  ></textarea>

  <label for="userPrompt" class="text-sm font-semibold text-gray-700">
    2. Prompt for Gemini:
  </label>
  <input 
    type="text" 
    id="userPrompt" 
    class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
    placeholder="E.g., Add a score counter in the top left corner."
  />

  <button 
    id="sendButton" 
    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition-colors duration-200"
  >
    Send to Vibe Assistant
  </button>
</div>

<!-- History Log Container -->
<div class="mt-4 p-4 bg-gray-50 rounded-xl border border-gray-200">
  <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Student Change Log History</h4>
  <div id="logHistory" class="space-y-2 text-xs text-gray-700 max-h-40 overflow-y-auto">
    <p class="text-gray-400 italic">No changes logged yet.</p>
  </div>
</div>
